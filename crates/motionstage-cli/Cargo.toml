[package]
name = "motionstage-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "motionstage"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
motionstage-server.workspace = true
motionstage-core.workspace = true
motionstage-protocol.workspace = true
motionstage-transport-quic = { workspace = true, features = ["insecure"] }
motionstage-discovery.workspace = true
motionstage-recording.workspace = true
motionstage-export-usd.workspace = true
motionstage-export-chan.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = true, features = ["clock"] }

[dev-dependencies]
tempfile = "3.14"
